{% extends "base.html" %}

{% block title %}Acceso denegado | Gestión de Citas Médicas{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl rounded-[2rem] border border-outline-variant/70 bg-white p-8 text-center shadow-card">
    <span class="material-symbols-rounded mx-auto grid size-16 place-items-center rounded-2xl bg-blue-50 text-4xl text-secondary" aria-hidden="true">lock</span>
    <p class="mt-6 text-xs font-black uppercase tracking-[0.16em] text-secondary">Error 403</p>
    <h1 class="mt-2 text-4xl font-black tracking-[-0.055em] text-primary">403 · Acceso denegado</h1>
    <p class="mt-4 leading-7 text-slate-600">No tenés permisos para acceder a esta sección.</p>
    <a class="mt-6 inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-primary to-secondary-container px-5 py-3 text-sm font-black text-white shadow-[0_14px_30px_rgba(0,88,190,0.2)]" href="{{ url_for('home.index') }}">
        Volver al inicio
        <span class="material-symbols-rounded text-base" aria-hidden="true">arrow_forward</span>
    </a>
</section>
{% endblock %}
